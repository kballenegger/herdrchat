# Pin, mute and the leading swipe actions on the chat list (PR #138, #139),
# and the long-press menu that holds Rename and Close. The trailing swipe is
# the inbox's (Settle, Snooze): regression/inbox.
# Leaves the Demo as it found it: every pin and mute is undone.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

# Leading swipe: Pin and Mute, on w1, the chat that needs you at the top of
# the list. The space cards (w6's agents and terminals, by tab) now push w2 to
# the bottom edge, where the action is under the home indicator and its tap is
# lost; and scrolled down to w2, a Pinned group appearing at the top is above
# the screen by design, which is not what #138 is about (at a scroll of zero
# it must be on screen).
- swipe:
    from:
      id: chat-row-w1
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible:
    id: swipe-action-pin
- assertVisible:
    id: swipe-action-mute
- takeScreenshot: chat-list-leading-${APPEARANCE}
- tapOn:
    id: swipe-action-pin
# A group that appears at the top must be on screen, not above it (#138).
- extendedWaitUntil:
    visible:
      id: chat-group-pinned
    timeout: 5000
- assertVisible:
    id: chat-row-w1

# Long press: the same choices, now reading Unpin, and Mute.
- longPressOn:
    id: chat-row-w1
- tapOn: Mute notifications
- longPressOn:
    id: chat-row-w1
- assertVisible: Unpin
- assertVisible: Unmute notifications
- takeScreenshot: chat-list-menu-${APPEARANCE}
- tapOn: Unmute notifications
- longPressOn:
    id: chat-row-w1
- tapOn: Unpin
- assertNotVisible:
    id: chat-group-pinned

# Every row of the menu is there, and Cancel leaves it doing nothing. On
# Android it was an alert, which keeps three buttons: Close chat and Cancel
# were cut, and picking an action was the only way out. Rename and Close
# live here, not on a swipe: the trailing swipe is the inbox's.
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- longPressOn:
    id: chat-row-w2
- assertVisible: Settle
- assertVisible: Snooze…
- assertVisible: Rename workspace…
- assertVisible: Close chat
- takeScreenshot: chat-list-menu-all-${APPEARANCE}
- tapOn: Cancel
- assertNotVisible: Close chat
