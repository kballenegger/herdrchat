# The chats list as an inbox (src/lib/inbox), the way T3 Code's sidebar
# works: working chats wait on a Working shelf and come back to the top when
# they finish; Settle moves a chat to Settled (with an Undo), Unsettle brings
# it back; Snooze hides it on Snoozed, Wake brings it back marked "Woke"
# until it is opened. Then Settings → Inbox → "Hide chats while they work"
# off leaves a working chat in the inbox.
#
# The working run is the Demo's "delegate the review" in w2 (notes), which
# works for about nineteen seconds (DELEGATE_STEP_AT_MS in
# src/lib/demo/subagents.ts): a plain message is answered in a second and a
# half, before the list would ever see it working.
#
# A trailing swipe opens Settle and Snooze; dragged far enough it settles on
# its own. Each swipe here taps the action only if the panel is still there,
# so either way the swipe ends settled.
#
# Leaves the Demo as it found it: every chat back in the inbox and the
# setting back on. scripts/e2e.sh also clears both around this flow.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

# Every Demo chat is in the inbox. w6's agent works, but w6 is a space card,
# which never hides: its idle agent and its terminals would go with it.
- extendedWaitUntil:
    visible:
      id: chat-row-w1
    timeout: 10000
- assertNotVisible:
    id: inbox-shelf-working
- assertNotVisible:
    id: inbox-shelf-snoozed
- assertNotVisible:
    id: inbox-shelf-settled
- takeScreenshot: inbox-start-${APPEARANCE}

# Give w2 a long run, and come back to the list: w2 waits under "Working · 1".
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: chat-row-w2
- extendedWaitUntil:
    visible:
      id: bubble-d2-2
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: delegate the review
- runFlow: _send.yaml
- extendedWaitUntil:
    visible: 'Agent: Review the release notes wording, running.*'
    timeout: 15000
- tapOn:
    id: thread-back
- extendedWaitUntil:
    visible:
      id: inbox-shelf-working
      text: Working · 1
    timeout: 10000
- assertNotVisible:
    id: chat-row-w2
# Opened, the shelf shows its row.
- tapOn:
    id: inbox-shelf-working
- extendedWaitUntil:
    visible:
      id: chat-row-w2
    timeout: 5000
- takeScreenshot: inbox-working-${APPEARANCE}

# When the run finishes the shelf goes and w2 is back at the top, above w1,
# which has been asking since the launch.
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-working
    timeout: 45000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: UP
- assertVisible:
    id: chat-row-w1
    below:
      id: chat-row-w2

# Settle w2 from its swipe: "Settled · Undo", and w2 under "Settled · 1".
- swipe:
    from:
      id: chat-row-w2
    direction: LEFT
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: swipe-action-settle
    commands:
      - assertVisible:
          id: swipe-action-snooze
      - takeScreenshot: inbox-swipe-${APPEARANCE}
      - tapOn:
          id: swipe-action-settle
- extendedWaitUntil:
    visible:
      id: undo-notice-message
      text: Settled
    timeout: 3000
- assertVisible:
    id: inbox-shelf-settled
    text: Settled · 1
# Undo puts it back at the top, and the notice goes.
- tapOn:
    id: undo-notice-undo
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-settled
    timeout: 5000
- assertNotVisible:
    id: undo-notice
- assertVisible:
    id: chat-row-w1
    below:
      id: chat-row-w2

# Settled again, then brought back from the shelf with Unsettle.
- swipe:
    from:
      id: chat-row-w2
    direction: LEFT
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: swipe-action-settle
    commands:
      - tapOn:
          id: swipe-action-settle
- extendedWaitUntil:
    visible:
      id: inbox-shelf-settled
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
# A settled row is one line: its title, and when it was settled.
- assertVisible:
    id: chat-row-trailing-w2
- takeScreenshot: inbox-settled-${APPEARANCE}
- swipe:
    from:
      id: chat-row-w2
    direction: LEFT
- waitForAnimationToEnd
- tapOn:
    id: swipe-action-unsettle
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-settled
    timeout: 5000

# Snooze w3 from its menu, for an hour: "Snoozed until …", and w3 under a
# shut "Snoozed · 1".
- scrollUntilVisible:
    element:
      id: chat-row-w3
    direction: DOWN
    centerElement: true
- longPressOn:
    id: chat-row-w3
- assertVisible: Rename workspace…
- assertVisible: Don't settle automatically
- tapOn: Snooze…
- extendedWaitUntil:
    visible: 'In 1 hour · .*'
    timeout: 5000
- tapOn: 'In 1 hour · .*'
- extendedWaitUntil:
    visible:
      id: undo-notice-message
      text: 'Snoozed until .*'
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: inbox-shelf-snoozed
      text: Snoozed · 1
    timeout: 5000
- assertNotVisible:
    id: chat-row-w3
- scrollUntilVisible:
    element:
      id: inbox-shelf-snoozed
    direction: DOWN
    centerElement: true
- tapOn:
    id: inbox-shelf-snoozed
# Its row says when it wakes.
- extendedWaitUntil:
    visible:
      id: chat-row-trailing-w3
      text: 1h
    timeout: 5000
- takeScreenshot: inbox-snoozed-${APPEARANCE}

# Wake it from its swipe: back in the inbox, marked "Woke".
- swipe:
    from:
      id: chat-row-w3
    direction: LEFT
- waitForAnimationToEnd
- tapOn:
    id: swipe-action-wake
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-snoozed
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w3
    direction: UP
    centerElement: true
- assertVisible:
    id: chat-row-woke-w3
- takeScreenshot: inbox-woke-${APPEARANCE}
# Opened and left, it has been seen: the mark goes.
- tapOn:
    id: chat-row-w3
- extendedWaitUntil:
    visible:
      id: thread-title
    timeout: 15000
- tapOn:
    id: thread-back
- extendedWaitUntil:
    visible:
      id: chat-row-w3
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: chat-row-woke-w3
    timeout: 5000

# Settings → Inbox: with "Hide chats while they work" off, a working chat
# stays in the inbox, its row saying it works.
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element:
      id: toggle-hide-working
    direction: DOWN
- tapOn:
    id: toggle-hide-working
- runFlow: _close-settings.yaml
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: chat-row-w2
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: delegate the review
- runFlow: _send.yaml
- extendedWaitUntil:
    visible: 'Agent: Review the release notes wording, running.*'
    timeout: 15000
- tapOn:
    id: thread-back
- extendedWaitUntil:
    visible:
      id: chat-row-w2
      text: '.*Working.*'
    timeout: 10000
- assertNotVisible:
    id: inbox-shelf-working
- takeScreenshot: inbox-not-hiding-${APPEARANCE}

# The setting back on, as every other flow expects it.
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element:
      id: toggle-hide-working
    direction: DOWN
- tapOn:
    id: toggle-hide-working
- runFlow: _close-settings.yaml
