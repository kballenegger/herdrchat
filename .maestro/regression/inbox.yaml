# The chats list as an inbox (src/lib/inbox), the way T3 Code's sidebar
# works, behind Settings → Inbox → "Sort chats as an inbox" (off by default;
# every other flow runs with it off). This flow turns it on first and off
# again at the end.
#
# Working chats wait on a Working shelf and come back to the top when they
# finish; Settle moves a chat to Settled (with an Undo), Unsettle brings it
# back; Snooze hides it on Snoozed, Wake brings it back marked "Woke" until
# it is opened. Then "Hide chats while they work" off leaves a working chat
# in the inbox.
#
# The working run is the Demo's "delegate the review" in w2 (notes), which
# works for about nineteen seconds (DELEGATE_STEP_AT_MS in
# src/lib/demo/subagents.ts): a plain message is answered in a second and a
# half, before the list would ever see it working.
#
# The trailing swipe: a short drag opens Settle and Snooze; a drag past the
# panel (fullSwipeLine: 58% of the row, never short of the panel plus a
# margin) settles with no tap. The two deliberate swipes below are drawn in
# screen coordinates on a row brought to the middle of the screen
# (centerElement), so each is a known length: 35% of the width (inside the
# line) and 92% (past it).
#
# Leaves the Demo as it found it: every chat back in the inbox and both
# settings back as they were. scripts/e2e.sh also clears them around it.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

# Settings → Inbox → "Sort chats as an inbox" on. Its other two rows only
# show while it is.
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element:
      id: toggle-inbox
    direction: DOWN
    centerElement: true
- assertNotVisible:
    id: toggle-hide-working
- tapOn:
    id: toggle-inbox
- extendedWaitUntil:
    visible:
      id: toggle-hide-working
    timeout: 5000
- assertVisible:
    id: settle-after
- runFlow: _close-settings.yaml

# Every Demo chat is in the inbox. w6's agent works, but w6 is a space card,
# which never hides: its idle agent and its terminals would go with it.
- extendedWaitUntil:
    visible:
      id: chat-row-w1
    timeout: 10000
- assertNotVisible:
    id: chat-group-needs-you
- assertNotVisible:
    id: inbox-shelf-working
- assertNotVisible:
    id: inbox-shelf-snoozed
- assertNotVisible:
    id: inbox-shelf-settled
- takeScreenshot: inbox-start-${APPEARANCE}

# Give w2 a long run, and come back to the list: w2 waits under "Working · 1".
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: chat-row-w2
- extendedWaitUntil:
    visible:
      id: bubble-d2-2
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: delegate the review
- runFlow: _send.yaml
- extendedWaitUntil:
    visible: 'Agent: Review the release notes wording, running.*'
    timeout: 15000
- tapOn:
    id: thread-back
- extendedWaitUntil:
    visible:
      id: inbox-shelf-working
      text: Working · 1
    timeout: 10000
- assertNotVisible:
    id: chat-row-w2
# Opened, the shelf shows its row.
- tapOn:
    id: inbox-shelf-working
- extendedWaitUntil:
    visible:
      id: chat-row-w2
    timeout: 5000
- takeScreenshot: inbox-working-${APPEARANCE}

# When the run finishes the shelf goes and w2 is back at the top, above w1,
# which has been asking since the launch.
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-working
    timeout: 45000
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: UP
- assertVisible:
    id: chat-row-w1
    below:
      id: chat-row-w2

# Settle w2 from its swipe: "Settled · Undo", and w2 under "Settled · 1".
# w2 is the top row, which cannot be brought to the middle, so this swipe is
# the row's own; it taps Settle if the panel is open.
- swipe:
    from:
      id: chat-row-w2
    direction: LEFT
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: swipe-action-settle
    commands:
      - tapOn:
          id: swipe-action-settle
- extendedWaitUntil:
    visible:
      id: undo-notice-message
      text: Settled
    timeout: 3000
# Undo puts it back at the top, and the notice goes. Undo within its five
# seconds: the shelf it went to is checked after the next settle, further
# down, since scrolling to it here outlasted the notice.
- tapOn:
    id: undo-notice-undo
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-settled
    timeout: 5000
- assertNotVisible:
    id: undo-notice
- scrollUntilVisible:
    element:
      id: chat-search
    direction: UP
- assertVisible:
    id: chat-row-w1
    below:
      id: chat-row-w2

# A long swipe settles with no tap: w3, in the middle of the screen, dragged
# across nearly the whole row. Nothing is tapped, the panel is not left
# open, and the notice says it settled.
- scrollUntilVisible:
    element:
      id: chat-row-w3
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- swipe:
    start: '96%, 50%'
    end: '4%, 50%'
    duration: 600
- extendedWaitUntil:
    visible:
      id: undo-notice-message
      text: Settled
    timeout: 3000
- assertNotVisible:
    id: swipe-action-settle
- scrollUntilVisible:
    element:
      id: inbox-shelf-settled
    direction: DOWN
- assertVisible:
    id: inbox-shelf-settled
    text: Settled · 1
- scrollUntilVisible:
    element:
      id: chat-row-w3
    direction: DOWN
    centerElement: true
# A settled row is one line: its title, and when it was settled. A row is one
# element to Maestro, so what it shows is read off its label.
- assertVisible:
    id: chat-row-w3
    text: '.*, \d{1,2}:\d{2}.*'
- takeScreenshot: inbox-settled-${APPEARANCE}
# Brought back from the shelf with Unsettle.
- swipe:
    from:
      id: chat-row-w3
    direction: LEFT
- waitForAnimationToEnd
- tapOn:
    id: swipe-action-unsettle
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-settled
    timeout: 5000

# The menu holds everything the swipe does, Rename and Close too.
- scrollUntilVisible:
    element:
      id: chat-row-w3
    direction: DOWN
    centerElement: true
- longPressOn:
    id: chat-row-w3
- assertVisible: Settle
- assertVisible: Snooze…
- assertVisible: Don't settle automatically
- assertVisible: Rename workspace…
- tapOn: Cancel

# A short swipe opens the panel without settling: w4, in the middle of the
# screen, dragged a third of the way. Snooze it from there for an hour:
# "Snoozed until …", and w4 under a shut "Snoozed · 1".
- scrollUntilVisible:
    element:
      id: chat-row-w4
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- swipe:
    start: '90%, 50%'
    end: '55%, 50%'
    duration: 600
- waitForAnimationToEnd
- assertVisible:
    id: swipe-action-snooze
- assertVisible:
    id: swipe-action-settle
- assertNotVisible:
    id: undo-notice
- takeScreenshot: inbox-swipe-${APPEARANCE}
- tapOn:
    id: swipe-action-snooze
- extendedWaitUntil:
    visible: 'In 1 hour · .*'
    timeout: 5000
- tapOn: 'In 1 hour · .*'
- extendedWaitUntil:
    visible:
      id: undo-notice-message
      text: 'Snoozed until .*'
    timeout: 3000
- scrollUntilVisible:
    element:
      id: inbox-shelf-snoozed
    direction: DOWN
- assertVisible:
    id: inbox-shelf-snoozed
    text: Snoozed · 1
- assertNotVisible:
    id: chat-row-w4
- scrollUntilVisible:
    element:
      id: inbox-shelf-snoozed
    direction: DOWN
    centerElement: true
- tapOn:
    id: inbox-shelf-snoozed
# Its row says when it wakes.
- extendedWaitUntil:
    visible:
      id: chat-row-w4
      text: '.*, 1h'
    timeout: 5000
- takeScreenshot: inbox-snoozed-${APPEARANCE}

# Wake it from its swipe: back in the inbox, marked "Woke".
- swipe:
    from:
      id: chat-row-w4
    direction: LEFT
- waitForAnimationToEnd
- tapOn:
    id: swipe-action-wake
- extendedWaitUntil:
    notVisible:
      id: inbox-shelf-snoozed
    timeout: 5000
- scrollUntilVisible:
    element:
      id: chat-row-w4
    direction: UP
    centerElement: true
- assertVisible:
    id: chat-row-w4
    text: '.*, Woke, .*'
- takeScreenshot: inbox-woke-${APPEARANCE}
# Opened and left, it has been seen: the mark goes.
- tapOn:
    id: chat-row-w4
- extendedWaitUntil:
    visible:
      id: thread-title
    timeout: 15000
- tapOn:
    id: thread-back
- extendedWaitUntil:
    visible:
      id: chat-row-w4
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: chat-row-w4
      text: '.*, Woke, .*'
    timeout: 5000

# Settings → Inbox: with "Hide chats while they work" off, a working chat
# stays in the inbox, its row saying it works.
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element:
      id: toggle-hide-working
    direction: DOWN
    centerElement: true
- tapOn:
    id: toggle-hide-working
- runFlow: _close-settings.yaml
- scrollUntilVisible:
    element:
      id: chat-row-w2
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: chat-row-w2
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: delegate the review
- runFlow: _send.yaml
- extendedWaitUntil:
    visible: 'Agent: Review the release notes wording, running.*'
    timeout: 15000
- tapOn:
    id: thread-back
- extendedWaitUntil:
    visible:
      id: chat-row-w2
      text: '.*Working.*'
    timeout: 10000
- assertNotVisible:
    id: inbox-shelf-working
- takeScreenshot: inbox-not-hiding-${APPEARANCE}

# Both settings back as every other flow expects them: hiding on, and the
# list no inbox at all, grouped again.
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element:
      id: toggle-hide-working
    direction: DOWN
    centerElement: true
- tapOn:
    id: toggle-hide-working
- tapOn:
    id: toggle-inbox
- extendedWaitUntil:
    notVisible:
      id: toggle-hide-working
    timeout: 5000
- runFlow: _close-settings.yaml
- extendedWaitUntil:
    visible:
      id: chat-group-needs-you
    timeout: 10000
