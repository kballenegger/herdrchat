# The tab bar: Chats and Computers. Computers lists the Demo, with a button
# for its files and one for its terminal. Files browses the
# Demo's home folder and one folder in it; the terminal is a login shell on the
# Demo, the same terminal screen a pane's opens, pushed over the tabs.
appId: dev.herdr.HerdrChat
---
- runFlow: _start.yaml

- tapOn: Computers
- extendedWaitUntil:
    visible:
      id: device-demo
    timeout: 5000
- takeScreenshot: computers-${APPEARANCE}

- tapOn:
    id: device-files-demo
- extendedWaitUntil:
    visible:
      id: files-entry-README.md
    timeout: 5000
- assertVisible:
    id: files-entry-code
- takeScreenshot: files-${APPEARANCE}
# A file downloads and opens the system's share sheet, on Android too (it once
# only said the file stayed in the app's storage). The sheet is the system's,
# so the check is that no error took its place; its screenshot must be opened.
- tapOn:
    id: files-entry-README.md
- waitForAnimationToEnd
- takeScreenshot: files-share-${APPEARANCE}
- assertNotVisible:
    id: error-banner
# Maestro sees nothing under the share sheet, so the screenshot is also the
# check that "Downloading" is gone by the time the sheet is up.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    # Dismiss through the empty header above the system share popover.
    # A tap on a file row also opens that row after dismissing the popover;
    # fixed or title-anchored swipes do not reliably dismiss it on iOS 26.
    commands:
      - tapOn:
          point: 50%, 10%
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: files-entry-code
    timeout: 5000
- tapOn:
    id: files-entry-code
- extendedWaitUntil:
    visible: This folder is empty.
    timeout: 5000
- tapOn:
    id: files-up
- extendedWaitUntil:
    visible:
      id: files-entry-README.md
    timeout: 5000
- tapOn:
    id: files-devices
- assertVisible:
    id: device-demo

- tapOn:
    id: device-terminal-demo
- extendedWaitUntil:
    visible:
      id: terminal-view
    timeout: 10000
- tapOn:
    id: terminal-back
- extendedWaitUntil:
    visible:
      id: device-demo
    timeout: 5000

- tapOn: Chats
- extendedWaitUntil:
    visible:
      id: chats-settings
    timeout: 5000
